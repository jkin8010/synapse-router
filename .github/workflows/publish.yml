name: Publish to npm

# NOTE: publishing is intentionally manual.
# Pushing a `v*` tag used to trigger this workflow, which force-set the tag
# version into packages/skill and packages/install-skill and published them to
# the public npm registry. Accidental tags (e.g. a doc/support release) would
# have pushed unreviewed public packages, so the trigger is now explicit.
#
# To release:
#   1. bump package versions and commit
#   2. tag the commit: git tag -a v0.x.y -m "..."
#   3. push the tag:    git push origin v0.x.y
#   4. run this workflow manually and enter that exact tag as the ref
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required for GitHub Release creation
      id-token: write      # Required for npm provenance (OIDC token flow)

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Derive version from git tag
        id: version
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          echo "Publishing version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Publish @synapse-router/skill
        run: |
          pnpm --filter @synapse-router/skill exec pnpm version "$VERSION" --no-git-tag-version
          pnpm --filter @synapse-router/skill publish --provenance --access public --no-git-checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @synapse-router/install-skill
        run: |
          pnpm --filter @synapse-router/install-skill exec pnpm version "$VERSION" --no-git-tag-version
          pnpm --filter @synapse-router/install-skill publish --provenance --access public --no-git-checks
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release create ${{ inputs.tag }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
