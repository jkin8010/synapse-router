<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sr-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#sr-gradient-dark)" opacity="0.15"/>
  <!-- Hexagon shape representing routing/network -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="#A5B4FC" stroke-width="6" stroke-linejoin="round"/>
  <!-- Inner connection lines (synapse/network metaphor) -->
  <line x1="100" y1="55" x2="100" y2="145" stroke="#A5B4FC" stroke-width="3" opacity="0.6"/>
  <line x1="55" y1="80" x2="145" y2="80" stroke="#A5B4FC" stroke-width="3" opacity="0.4"/>
  <line x1="55" y1="120" x2="145" y2="120" stroke="#A5B4FC" stroke-width="3" opacity="0.4"/>
  <!-- Center dot (the "router" nexus) -->
  <circle cx="100" cy="100" r="12" fill="#A5B4FC"/>
  <circle cx="100" cy="100" r="5" fill="#1a1d24"/>
</svg>
