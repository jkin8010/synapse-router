<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sr-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#sr-gradient)" opacity="0.1"/>
  <!-- Hexagon shape representing routing/network -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="#6366F1" stroke-width="6" stroke-linejoin="round"/>
  <!-- Inner connection lines (synapse/network metaphor) -->
  <line x1="100" y1="55" x2="100" y2="145" stroke="#6366F1" stroke-width="3" opacity="0.6"/>
  <line x1="55" y1="80" x2="145" y2="80" stroke="#6366F1" stroke-width="3" opacity="0.4"/>
  <line x1="55" y1="120" x2="145" y2="120" stroke="#6366F1" stroke-width="3" opacity="0.4"/>
  <!-- Center dot (the "router" nexus) -->
  <circle cx="100" cy="100" r="12" fill="#6366F1"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff"/>
</svg>
